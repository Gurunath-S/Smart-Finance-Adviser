name: Deploy Mobile EAS Update

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/deploy-mobile-update.yml'
  workflow_dispatch:

jobs:
  update:
    name: EAS Over-The-Air Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Setup EAS & Expo CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Publish Over-The-Air (OTA) Update
        working-directory: ./mobile
        run: eas update --auto --branch production --message "Automated update from GitHub commit ${{ github.sha }}"
